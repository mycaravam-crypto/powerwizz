[package]
name = "powerwizz"
version = "0.1.0"
edition = "2024"
default-run = "powerwizz"

[dependencies]
csv = "1.4.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
fastrand = "2.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util", "signal"] }

[profile.release]
strip = true
