[package]
name = "powerwizz"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.37.0"
fastrand = "2.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
