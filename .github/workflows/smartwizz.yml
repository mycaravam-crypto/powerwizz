# AI pull request review (bugs, security, missing tests, ENGINEERING_STANDARD) via SmartWizz.
# Report in the job summary + JSON artifact; fails on high/critical findings. Nothing is posted to the PR.
# SmartWizz is pinned to a commit: bump the SHA in both places to upgrade.
name: smartwizz
on:
  pull_request:
permissions:
  contents: read
jobs:
  review:
    # Fork PRs get no secrets; skip them instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: mycaravam-crypto/smartwizz/.github/workflows/review.yml@227302e8b84f721ca3bf594e7943fb95034c0c87 # main 2026-10-18
    with:
      fail-on: high
      smartwizz-ref: 227302e8b84f721ca3bf594e7943fb95034c0c87
    secrets:
      SMARTWIZZ_API_KEY: ${{ secrets.SMARTWIZZ_API_KEY }}
